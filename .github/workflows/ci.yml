name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements.lock
      - name: Install the locked dependencies
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Lint (unused imports and names, undefined names)
        run: python -m pyflakes src scripts tests havola_new.py
      - name: Tests (offline, against a temporary store)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t legal-rag:ci .
