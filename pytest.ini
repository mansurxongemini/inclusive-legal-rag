[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Leaks are bugs: a coroutine that was never awaited, a file or SQLite connection that was never closed, an exception
# that was swallowed in a destructor now fail the test that caused them.
filterwarnings =
    error::RuntimeWarning
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
