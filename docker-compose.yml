version: '3.8'

services:
  legal-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - EMBEDDING_MODEL=baai/bge-m3
      - GENERATION_MODEL_PRIMARY=google/gemini-2.5-flash
      - GENERATION_MODEL_FALLBACK=meta-llama/llama-3.3-70b-instruct
      - RERANK_MODEL=google/gemini-2.5-flash
      - STORAGE_DIR=/app/data/store
      - CACHE_DB_PATH=/app/data/cache/query_cache.db
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
      - RATE_LIMIT_PER_MINUTE=60
      - MOCK_EXTERNAL_APIS=${MOCK_EXTERNAL_APIS:-false}
    volumes:
      - ./data/store:/app/data/store
      - ./data/cache:/app/data/cache
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '1.5'
